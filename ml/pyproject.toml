[project]
name = "legit-internship-detector-ml"
version = "0.1.0"
description = "Legit Internship Detector data preparation and model training"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "datasketch>=1.6",
    "kaggle>=1.7",
]

[tool.setuptools]
# Scripts only; nothing to package.
packages = []
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
