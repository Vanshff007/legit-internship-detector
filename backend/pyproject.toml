[project]
name = "legit-internship-detector-backend"
version = "0.1.0"
description = "Legit Internship Detector API and detection engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # Must match the version in ml/ that exported the artifact (joblib pickles).
    "scikit-learn==1.9.1",
    "joblib>=1.4",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "certifi>=2024.2",
    "tldextract>=5.1",
    "rapidfuzz>=3.6",
    "python-whois>=0.9",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
