name: Deploy

# Builds the Docker image and publishes it to GitHub Container Registry.
# Render runs that image; if the RENDER_DEPLOY_HOOK secret is set, it is told to redeploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/vanshff007/legit-internship-detector
  MODEL_RELEASE: model-text-baseline-v1

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download text model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$MODEL_RELEASE" --pattern "*.joblib" --dir ml/artifacts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
